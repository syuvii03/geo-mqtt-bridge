<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Home Device Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-6 font-sans">

  <div class="max-w-6xl mx-auto">
    <!-- Header / ปุ่มเพิ่มอุปกรณ์ / สถานะ MQTT -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-3">
          อุปกรณ์ไฟฟ้าในบ้าน
          <span id="mqttStatus" class="text-xs px-2.5 py-1 rounded-full bg-amber-100 text-amber-700 font-semibold border border-amber-200">
            ⏳ กำลังเชื่อมต่อ MQTT...
          </span>
        </h1>
        <p class="text-sm text-slate-500 mt-1">ระบบติดตามการใช้พลังงาน สั่งงาน IR Remote และ GPS Geofence</p>
      </div>

      <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2.5 rounded-xl transition shadow-sm flex items-center gap-2">
        <span class="text-xl font-bold">+</span> เพิ่มอุปกรณ์ใหม่
      </button>
    </div>

    <!-- Grid แสดง Card อุปกรณ์ -->
    <div id="deviceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Card อุปกรณ์จะถูกสร้างผ่าน JavaScript -->
    </div>

    <!-- ปุ่มส่งออก CSV -->
    <div class="mt-8 flex justify-between items-center">
      <button onclick="exportCSV()" class="px-4 py-2 border border-slate-300 rounded-lg text-sm text-slate-600 hover:bg-white bg-slate-100 transition shadow-sm">
        ↓ ส่งออก CSV
      </button>
      <span class="text-xs text-slate-400">อัปเดตข้อมูลอัตโนมัติทุก 4 วินาที</span>
    </div>
  </div>

  <!-- Modal Popup: เพิ่มอุปกรณ์ใหม่ -->
  <div id="addModal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-slate-800">➕ เพิ่มอุปกรณ์ใหม่</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
      </div>
      
      <form id="addDeviceForm" onsubmit="handleAddDevice(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">ID อุปกรณ์ (ภาษาอังกฤษ ห้ามซ้ำ)</label>
          <input type="text" id="devId" required placeholder="เช่น device_a หรือ light_room1" class="w-full border border-slate-200 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">ชื่ออุปกรณ์</label>
          <input type="text" id="devName" required placeholder="เช่น โคมไฟ A, พัดลมตั้งโต๊ะ" class="w-full border border-slate-200 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- ตัวเลือกรูปภาพ / ไอคอน -->
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">รูปภาพอุปกรณ์ / ไอคอน</label>
          <div class="flex gap-2 mb-2">
            <input type="text" id="devIcon" placeholder="ใส่อีโมจิ เช่น 💡 หรือ URL รูปภาพ" class="w-full border border-slate-200 rounded-lg p-2.5 text-sm outline-none">
          </div>
          <div class="text-xs text-slate-400 mb-1">หรือ อัปโหลดไฟล์รูปภาพจากเครื่อง:</div>
          <input type="file" id="devImageFile" accept="image/*" onchange="handleImageUpload(event)" class="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">ขา GPIO (ESP32)</label>
            <input type="number" id="devPin" required value="25" class="w-full border border-slate-200 rounded-lg p-2.5 text-sm outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">กำลังไฟฟ้า (วัตต์ / W)</label>
            <input type="number" id="devWatt" required value="100" class="w-full border border-slate-200 rounded-lg p-2.5 text-sm outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">ระยะสั่งงาน GPS (เมตร)</label>
          <input type="number" id="devDist" required value="500" class="w-full border border-slate-200 rounded-lg p-2.5 text-sm outline-none">
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm text-slate-600 bg-slate-100 hover:bg-slate-200 font-medium">
            ยกเลิก
          </button>
          <button type="submit" class="px-4 py-2 rounded-lg text-sm text-white bg-blue-600 hover:bg-blue-700 font-medium shadow-sm">
            บันทึกอุปกรณ์
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // รายการอุปกรณ์เริ่มต้น
    let devices = [
      { id: 'aircon', name: 'แอร์', icon: '❄️', watt: 1200, pin: 19, state: false, kwh: 0, cost: 0, timer: 0 },
      { id: 'light', name: 'ไฟในบ้าน', icon: '💡', watt: 10, pin: 21, state: false, kwh: 0, cost: 0, timer: 0 },
      { id: 'light2', name: 'ไฟนอกบ้าน', icon: '💡', watt: 10, pin: 23, state: false, kwh: 0, cost: 0, timer: 0 },
      { id: 'fan', name: 'พัดลม', icon: '🌀', watt: 50, pin: 32, state: false, kwh: 0, cost: 0, timer: 0 },
      { id: 'plug', name: 'ปลั๊กไฟทั่วไป', icon: '🔌', watt: 300, pin: 22, state: false, kwh: 0, cost: 0, timer: 0 }
    ];

    let uploadedImageData = '';

    // เชื่อมต่อ MQTT Broker (HiveMQ Cloud)
    const client = mqtt.connect('wss://a130eedbb798414f983f14f784934179.s1.eu.hivemq.cloud:8884/mqtt', {
      username: 'esp32',
      password: '25022005'
    });

    client.on('connect', () => {
      const statusEl = document.getElementById('mqttStatus');
      statusEl.className = "text-xs px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 font-semibold border border-emerald-200";
      statusEl.innerHTML = "🟢 เชื่อมต่อ MQTT แล้ว";

      client.subscribe('myhome/telemetry');
    });

    client.on('offline', () => {
      const statusEl = document.getElementById('mqttStatus');
      statusEl.className = "text-xs px-2.5 py-1 rounded-full bg-red-100 text-red-700 font-semibold border border-red-200";
      statusEl.innerHTML = "🔴 ขาดการเชื่อมต่อ";
    });

    // รับค่า Telemetry จาก ESP32
    client.on('message', (topic, payload) => {
      if (topic === 'myhome/telemetry') {
        try {
          const data = JSON.parse(payload.toString());
          devices.forEach(dev => {
            if (data[dev.id]) {
              dev.state = data[dev.id].state;
              dev.kwh = data[dev.id].kwh || 0;
              dev.cost = dev.kwh * 4.5; // คำนวณค่าไฟอัตรา 4.5 บาท/หน่วย
            }
          });
          renderDevices();
        } catch (e) { console.error('JSON Parse Error:', e); }
      }
    });

    // แสดงผลอุปกรณ์บนหน้าจอ
    function renderDevices() {
      const grid = document.getElementById('deviceGrid');
      grid.innerHTML = devices.map(dev => {
        // จัดการการแสดงผลไอคอน/รูปภาพ
        const isUrlOrBase64 = dev.icon.startsWith('http') || dev.icon.startsWith('data:image');
        const iconHtml = isUrlOrBase64 
          ? `<img src="${dev.icon}" class="w-8 h-8 object-cover rounded-lg border border-slate-200">`
          : `<span class="text-2xl">${dev.icon || '⚡'}</span>`;

        return `
          <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm flex flex-col justify-between relative group hover:shadow-md transition">
            
            <!-- ปุ่มลบอุปกรณ์ -->
            <button onclick="deleteDevice('${dev.id}')" title="ลบอุปกรณ์" class="absolute top-4 right-4 text-slate-300 hover:text-red-500 font-bold text-sm p-1 rounded-lg transition">
              🗑️
            </button>

            <div>
              <!-- หัวข้ออุปกรณ์ & รูปภาพ -->
              <div class="flex justify-between items-start mb-2 pr-6">
                <div>
                  <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">${dev.id} (GPIO ${dev.pin})</span>
                  <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2.5 mt-0.5">
                    ${iconHtml}
                    <span>${dev.name}</span>
                  </h3>
                </div>
              </div>

              <!-- สถานะสวิตช์ เปิด/ปิด -->
              <div class="flex justify-between items-center my-4">
                <div class="flex items-center gap-2">
                  <div class="w-2.5 h-2.5 rounded-full ${dev.state ? 'bg-emerald-500 shadow-emerald-200 shadow-lg animate-pulse' : 'bg-slate-300'}"></div>
                  <span class="text-sm font-semibold ${dev.state ? 'text-emerald-600' : 'text-slate-400'}">
                    ${dev.state ? 'เปิดอยู่ (ON)' : 'ปิดอยู่ (OFF)'}
                  </span>
                </div>
                
                <button onclick="toggleDevice('${dev.id}')" class="w-14 h-8 flex items-center rounded-full p-1 transition-colors duration-300 ${dev.state ? 'bg-slate-700 justify-end' : 'bg-slate-200 justify-start'}">
                  <div class="bg-white w-6 h-6 rounded-full shadow-md"></div>
                </button>
              </div>
            </div>

            <!-- รายละเอียดพลังงานและตั้งเวลา -->
            <div class="border-t border-slate-100 pt-3">
              <div class="flex justify-between items-center text-sm font-semibold mb-2">
                <span class="text-slate-500">${dev.watt} W</span>
                <span class="text-emerald-600 font-bold">฿${dev.cost.toFixed(2)} <span class="text-[10px] font-normal text-slate-400">(${dev.kwh.toFixed(3)} kWh)</span></span>
              </div>

              <div class="text-xs text-slate-400 flex justify-between items-center">
                <span>ตั้งเวลาปิดอัตโนมัติ:</span>
                ${dev.state 
                  ? `<select onchange="setTimer('${dev.id}', this.value)" class="text-xs bg-slate-50 border border-slate-200 rounded p-1 text-slate-600">
                      <option value="0">ปิดการตั้งเวลา</option>
                      <option value="15">15 นาที</option>
                      <option value="30">30 นาที</option>
                      <option value="60">1 ชั่วโมง</option>
                     </select>`
                  : `<span class="text-slate-300">เปิดอุปกรณ์เพื่อตั้งเวลา</span>`
                }
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // สลับสถานะเปิด/ปิดอุปกรณ์
    function toggleDevice(id) {
      const dev = devices.find(d => d.id === id);
      if (dev) {
        dev.state = !dev.state;
        renderDevices();
        client.publish(`myhome/${id}/set`, dev.state ? 'ON' : 'OFF');
      }
    }

    // ฟังก์ชันลบอุปกรณ์
    function deleteDevice(id) {
      if (confirm(`คุณต้องการลบอุปกรณ์ [${id}] หรือไม่?`)) {
        devices = devices.filter(d => d.id !== id);
        renderDevices();
      }
    }

    // แปลงไฟล์รูปภาพเป็น Base64
    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          uploadedImageData = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function openModal() { document.getElementById('addModal').classList.remove('hidden'); }
    function closeModal() { 
      document.getElementById('addModal').classList.add('hidden');
      uploadedImageData = '';
    }

    // เพิ่มอุปกรณ์ใหม่เข้า State
    function handleAddDevice(e) {
      e.preventDefault();
      const id = document.getElementById('devId').value.trim().toLowerCase().replace(/\s+/g, '_');
      const name = document.getElementById('devName').value.trim();
      const iconInput = document.getElementById('devIcon').value.trim();
      const pin = parseInt(document.getElementById('devPin').value);
      const watt = parseFloat(document.getElementById('devWatt').value);
      const triggerDist = parseFloat(document.getElementById('devDist').value);

      if (devices.some(d => d.id === id)) {
        alert('❌ ID อุปกรณ์นี้ถูกใช้งานแล้ว กรุณาตั้ง ID ใหม่');
        return;
      }

      // ใช้รูปที่อัปโหลดก่อน หากไม่มีให้ใช้ค่าในช่อง Input หรือ Emoji ⚡
      const finalIcon = uploadedImageData || iconInput || '⚡';

      devices.push({ id, name, icon: finalIcon, watt, pin, state: false, kwh: 0, cost: 0, triggerDist });
      renderDevices();
      closeModal();
      document.getElementById('addDeviceForm').reset();
    }

    // ตั้งเวลาปิด
    function setTimer(id, minutes) {
      if (minutes > 0) {
        alert(`ตั้งเวลาปิดอุปกรณ์ [${id}] ในอีก ${minutes} นาทีเรียบร้อยแล้ว`);
      }
    }

    // ส่งออกข้อมูล CSV
    function exportCSV() {
      let csv = "ID,Name,Pin,Watt,State,kWh,Cost_THB\n";
      devices.forEach(d => {
        csv += `${d.id},${d.name},${d.pin},${d.watt},${d.state ? 'ON' : 'OFF'},${d.kwh},${d.cost.toFixed(2)}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `device_report_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    // เริ่มต้นแสดงผล
    renderDevices();
  </script>
</body>
</html>
