<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แผงควบคุมไฟฟ้า (MQTT)</title>
<style>
  :root {
    --bg: #F6F7F9; --panel: #FFFFFF; --panel-alt: #EEF1F4; --panel-raised: #FFFFFF;
    --on-color: #0D9488; --on-glow: rgba(13, 148, 136, 0.25); --off-color: #9CA3AF;
    --warn-color: #EA580C; --danger-color: #DC2626; --danger-glow: rgba(220, 38, 38, 0.35);
    --text-primary: #1F2933; --text-secondary: #5B6472;
    --text-dim: #9AA3AF; --border: #E3E6EB; --border-light: #D3D8DF; --thumb-off: #6B7280;
  }
  body.theme-dark {
    --bg: #0B0E11; --panel: #151A20; --panel-alt: #1B2229; --panel-raised: #1F2730;
    --on-color: #5EEAD4; --on-glow: rgba(94, 234, 212, 0.45); --off-color: #4B5563;
    --warn-color: #FF8A5B; --danger-color: #F87171; --danger-glow: rgba(248, 113, 113, 0.4);
    --text-primary: #EDEFF2; --text-secondary: #8B94A0;
    --text-dim: #565F6B; --border: #242C35; --border-light: #313B47; --thumb-off: #6B7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text-primary);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh; padding: 20px 16px 60px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .title-block .eyebrow { font-family: monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px; }
  .title-block h1 { font-size: 24px; font-weight: 700; }
  .header-actions { display: flex; align-items: center; gap: 10px; }
  .conn-status { display: flex; align-items: center; gap: 8px; font-family: monospace; font-size: 12px; background: var(--panel); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off-color); }
  .dot.live { background: var(--on-color); box-shadow: 0 0 8px var(--on-glow); }

  .config-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .config-panel label { font-family: monospace; font-size: 11px; color: var(--text-secondary); }
  .config-panel input { background: var(--panel-alt); border: 1px solid var(--border-light); color: var(--text-primary); font-family: monospace; font-size: 13px; padding: 6px 10px; border-radius: 6px; flex: 1; min-width: 140px; }
  .btn-connect { background: var(--panel-raised); border: 1px solid var(--border-light); color: var(--text-primary); font-weight: 600; font-size: 12px; padding: 7px 14px; border-radius: 6px; cursor: pointer; }
  .btn-connect:hover { border-color: var(--on-color); color: var(--on-color); }
  .btn-add { background: var(--on-color); border: 1px solid var(--on-color); color: #fff; font-weight: 600; font-size: 13px; padding: 7px 14px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .btn-add:hover { opacity: 0.9; }
  .config-hint { font-family: monospace; font-size: 10px; color: var(--text-dim); width: 100%; }

  .rack-header { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 10px; }
  .rack-label { font-family: monospace; font-size: 11px; color: var(--text-dim); text-transform: uppercase; }
  .breaker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .breaker { background: linear-gradient(180deg, var(--panel-raised), var(--panel)); border: 1px solid var(--border); border-radius: 12px; padding: 16px; transition: border-color 0.25s; position: relative; }
  .breaker.is-on { border-color: rgba(13,148,136,0.4); }
  .breaker-top { display: flex; justify-content: space-between; margin-bottom: 14px; padding-right: 32px; }
  .breaker-num { font-family: monospace; font-size: 10px; color: var(--text-dim); margin-bottom: 4px; }
  
  .breaker-name { font-size: 16px; font-weight: 600; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .breaker-icon-img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border-light); background: var(--panel-alt); }
  .breaker-icon-emoji { font-size: 36px; line-height: 1.1; }

  .led-del-wrap { display: flex; align-items: center; gap: 8px; position: absolute; top: 12px; right: 12px; z-index: 10; }
  .led { width: 10px; height: 10px; border-radius: 50%; background: var(--off-color); }
  .breaker.is-on .led { background: var(--on-color); box-shadow: 0 0 10px var(--on-glow); }

  .btn-delete-dev { background: transparent; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; padding: 4px; border-radius: 4px; }
  .btn-delete-dev:hover { color: var(--danger-color); background: rgba(220,38,38,0.1); }

  .breaker-mid { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .status-text { font-family: monospace; font-size: 12px; color: var(--text-secondary); }
  .breaker.is-on .status-text { color: var(--on-color); }
  .switch-track { width: 44px; height: 72px; background: var(--panel-alt); border: 1px solid var(--border-light); border-radius: 8px; padding: 4px; cursor: pointer; }
  .switch-track.disabled { cursor: not-allowed; opacity: 0.5; }
  .switch-thumb { width: 34px; height: 32px; background: var(--thumb-off); border-radius: 6px; transition: transform 0.2s ease; }
  .switch-track.on .switch-thumb { transform: translateY(30px); background: #0D9488; box-shadow: 0 0 10px var(--on-glow); }

  .device-cost { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); font-family: monospace; font-size: 12px; }

  .cost-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .cost-item { background: linear-gradient(180deg, var(--panel-raised), var(--panel)); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; }
  .cost-label { font-family: monospace; font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; }
  .cost-value { font-family: monospace; font-size: 24px; font-weight: 600; }
  .cost-value.accent { color: var(--on-color); }

  .util-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .util-btn { background: transparent; border: 1px dashed var(--border-light); color: var(--text-secondary); font-family: monospace; font-size: 11px; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
  .util-btn:hover { border-color: var(--on-color); color: var(--on-color); }

  footer { margin-top: 24px; font-family: monospace; font-size: 11px; color: var(--text-dim); line-height: 1.6; }
  footer code { background: var(--panel); padding: 2px 6px; border-radius: 4px; color: var(--text-secondary); }

  .theme-toggle { background: var(--panel); border: 1px solid var(--border); color: var(--text-secondary); font-size: 16px; width: 34px; height: 34px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  /* Modal Popup */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
  .modal-overlay.hidden { display: none; }
  .modal-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-head h3 { font-size: 18px; font-weight: 700; }
  .modal-close { background: transparent; border: none; font-size: 18px; color: var(--text-dim); cursor: pointer; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-family: monospace; font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; text-transform: uppercase; }
  .form-group input { width: 100%; background: var(--panel-alt); border: 1px solid var(--border-light); color: var(--text-primary); font-family: inherit; font-size: 13px; padding: 8px 10px; border-radius: 6px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <div class="eyebrow">HOME AUTOMATION / MQTT</div>
      <h1>แผงควบคุมไฟฟ้า</h1>
    </div>
    <div class="header-actions">
      <div class="conn-status">
        <span class="dot" id="connDot"></span>
        <span id="connText">ยังไม่ได้เชื่อมต่อ</span>
      </div>
      <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">🌙</button>
    </div>
  </header>

  <div class="config-panel">
    <label>ค่าไฟ (บาท/หน่วย)</label>
    <input id="cfgRate" type="number" step="0.01" value="4.40" style="max-width:80px;">
    <button class="btn-connect" id="btnConnect" onclick="handleConnectClick()">เชื่อมต่อ</button>
  </div>

  <div class="cost-summary">
    <div class="cost-item">
      <div class="cost-label">พลังงานรวม</div>
      <div class="cost-value" id="totalKwh">0.000 kWh</div>
    </div>
    <div class="cost-item">
      <div class="cost-label">ค่าไฟรวมโดยประมาณ</div>
      <div class="cost-value accent" id="totalCost">฿0.00</div>
    </div>
  </div>

  <!-- ส่วนหัวหมวดอุปกรณ์ พร้อมปุ่ม + เพิ่มอุปกรณ์ -->
  <div class="rack-header">
    <div class="rack-label">อุปกรณ์</div>
    <button class="btn-add" onclick="openAddModal()"><span>+</span> เพิ่มอุปกรณ์ใหม่</button>
  </div>

  <div class="breaker-grid" id="breakerGrid"></div>

  <div class="util-row">
    <button class="util-btn" onclick="exportCsv()">⬇ ส่งออก CSV</button>
  </div>

  <footer>
    Topic ควบคุม: <code id="footCtrl">myhome/&lt;device&gt;/set</code><br>
    Topic สถานะรวม: <code id="footStatus">myhome/telemetry</code>
  </footer>
</div>

<!-- Modal Popup เพิ่มอุปกรณ์ -->
<div class="modal-overlay hidden" id="addModal">
  <div class="modal-card">
    <div class="modal-head">
      <h3>➕ เพิ่มอุปกรณ์ใหม่</h3>
      <button class="modal-close" onclick="closeAddModal()">✕</button>
    </div>
    <form onsubmit="handleAddDeviceSubmit(event)">
      <div class="form-group">
        <label>ID อุปกรณ์ (ภาษาอังกฤษ ห้ามซ้ำ)</label>
        <input type="text" id="addDevId" required placeholder="เช่น device_a หรือ light_room1">
      </div>
      <div class="form-group">
        <label>ชื่ออุปกรณ์</label>
        <input type="text" id="addDevName" required placeholder="เช่น โคมไฟ A, พัดลมตั้งโต๊ะ">
      </div>
      <div class="form-group">
        <label>ไอคอน (Emoji หรือ URL รูปภาพ)</label>
        <input type="text" id="addDevIcon" placeholder="เช่น 💡 หรือ https://.../image.png">
      </div>
      <div class="form-group">
        <label>หรือ อัปโหลดไฟล์รูปภาพจากเครื่อง</label>
        <input type="file" id="addDevFile" accept="image/*" onchange="handleModalImageUpload(event)">
      </div>
      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>ขา GPIO</label>
          <input type="number" id="addDevPin" required value="25">
        </div>
        <div class="form-group" style="flex:1;">
          <label>กำลังไฟ (วัตต์ / W)</label>
          <input type="number" id="addDevWatt" required value="100">
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-connect" onclick="closeAddModal()">ยกเลิก</button>
        <button type="submit" class="btn-add">บันทึกอุปกรณ์</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.4/mqtt.min.js"></script>
<script>
  const DEFAULT_CONFIG = {
    host: "a130eedbb798414f983f14f784934179.s1.eu.hivemq.cloud",
    port: "8884",
    user: "esp32",
    pass: "25022005",
    prefix: "myhome",
    rate: 4.40
  };

  let rate = 4.40;
  let prefix = "myhome";
  let client = null;
  let connected = false;

  let devices = {
    aircon: { name: "แอร์", watt: 1200, state: false, kwh: 0, icon: "❄️", pin: 19 },
    light:  { name: "ไฟในบ้าน", watt: 10, state: false, kwh: 0, icon: "💡", pin: 21 },
    light2: { name: "ไฟนอกบ้าน", watt: 10, state: false, kwh: 0, icon: "💡", pin: 23 },
    fan:    { name: "พัดลม", watt: 50, state: false, kwh: 0, icon: "🌀", pin: 32 },
    plug:   { name: "ปลั๊กไฟทั่วไป", watt: 300, state: false, kwh: 0, icon: "🔌", pin: 22 }
  };

  let uploadedModalImage = "";

  function setConnected(isConnected) {
    connected = isConnected;
    document.getElementById("connDot").classList.toggle("live", isConnected);
    document.getElementById("connText").textContent = isConnected ? "เชื่อมต่อ MQTT Broker แล้ว" : "ไม่ได้เชื่อมต่อ";
    document.getElementById("btnConnect").textContent = isConnected ? "ตัดการเชื่อมต่อ" : "เชื่อมต่อ";
  }

  function handleConnectClick() {
    if (connected) { if (client) client.end(true); setConnected(false); return; }
    connectMqtt();
  }

  function connectMqtt() {
    rate = parseFloat(document.getElementById("cfgRate").value) || 4.40;
    const url = `wss://${DEFAULT_CONFIG.host}:${DEFAULT_CONFIG.port}/mqtt`;

    client = mqtt.connect(url, {
      username: DEFAULT_CONFIG.user,
      password: DEFAULT_CONFIG.pass,
      clean: true,
      reconnectPeriod: 3000
    });

    client.on('connect', () => {
      setConnected(true);
      client.subscribe(`${prefix}/telemetry`);
      client.subscribe(`${prefix}/+/state`);
    });

    client.on('message', (topic, payload) => {
      const parts = topic.split('/');
      if (parts.length === 2 && parts[1] === 'telemetry') {
        try {
          const data = JSON.parse(payload.toString());
          Object.keys(data).forEach(key => {
            if (key === 'totalKwh') return;
            if (devices[key]) {
              devices[key].watt = data[key].watt ?? devices[key].watt;
              devices[key].state = data[key].state ?? devices[key].state;
              devices[key].kwh = data[key].kwh ?? devices[key].kwh;
            }
          });
          renderBreakers();
          renderCostSummary(data.totalKwh || 0);
        } catch (e) {}
      } else if (parts.length === 3 && parts[2] === 'state') {
        const id = parts[1];
        if (devices[id]) {
          devices[id].state = (payload.toString() === "ON");
          renderBreakers();
        }
      }
    });
  }

  function toggleDevice(id) {
    if (!connected || !devices[id]) return;
    devices[id].state = !devices[id].state;
    renderBreakers();
    client.publish(`${prefix}/${id}/set`, devices[id].state ? "ON" : "OFF");
  }

  // --- ระบบเพิ่ม/ลบ อุปกรณ์ ---
  function openAddModal() { document.getElementById("addModal").classList.remove("hidden"); }
  function closeAddModal() { document.getElementById("addModal").classList.add("hidden"); uploadedModalImage = ""; }

  function handleModalImageUpload(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(event) { uploadedModalImage = event.target.result; };
      reader.readAsDataURL(file);
    }
  }

  function handleAddDeviceSubmit(e) {
    e.preventDefault();
    const id = document.getElementById("addDevId").value.trim().toLowerCase().replace(/\s+/g, '_');
    const name = document.getElementById("addDevName").value.trim();
    const iconInput = document.getElementById("addDevIcon").value.trim();
    const pin = parseInt(document.getElementById("addDevPin").value);
    const watt = parseFloat(document.getElementById("addDevWatt").value);

    if (devices[id]) { alert("❌ ID อุปกรณ์นี้มีอยู่แล้ว"); return; }

    devices[id] = {
      name: name,
      watt: watt,
      state: false,
      kwh: 0,
      icon: uploadedModalImage || iconInput || "⚡",
      pin: pin
    };

    renderBreakers();
    closeAddModal();
  }

  function deleteDevice(e, id) {
    e.stopPropagation(); // กันไม่ให้กดโดนปุ่มสวิตช์เปิด/ปิด
    if (confirm(`คุณต้องการลบอุปกรณ์ [${devices[id].name}] ใช่หรือไม่?`)) {
      delete devices[id];
      renderBreakers();
    }
  }

  function renderBreakers() {
    const grid = document.getElementById("breakerGrid");
    const ids = Object.keys(devices);
    if (ids.length === 0) {
      grid.innerHTML = `<div style="font-family:monospace; font-size:12px; color:var(--text-dim);">ไม่มีอุปกรณ์ สามารถกดปุ่ม "+ เพิ่มอุปกรณ์ใหม่" ด้านบน</div>`;
      return;
    }
    grid.innerHTML = "";
    ids.forEach((id) => {
      const dev = devices[id];
      const isOn = dev.state;
      const cost = (dev.kwh || 0) * rate;

      const iconStr = dev.icon || "⚡";
      const isImg = iconStr.startsWith("http") || iconStr.startsWith("data:image");
      const iconHtml = isImg 
        ? `<img src="${iconStr}" class="breaker-icon-img">`
        : `<span class="breaker-icon-emoji">${iconStr}</span>`;

      const card = document.createElement("div");
      card.className = "breaker" + (isOn ? " is-on" : "");

      card.innerHTML = `
        <div class="led-del-wrap">
          <div class="led"></div>
          <button class="btn-delete-dev" onclick="deleteDevice(event, '${id}')" title="ลบอุปกรณ์">🗑️</button>
        </div>
        <div class="breaker-top">
          <div>
            <div class="breaker-num">${id.toUpperCase()} ${dev.pin ? '(GPIO '+dev.pin+')' : ''}</div>
            <div class="breaker-name">
              ${iconHtml}
              <span>${dev.name}</span>
            </div>
          </div>
        </div>
        <div class="breaker-mid">
          <div class="status-text">${isOn ? "กำลังทำงาน" : "ปิดอยู่"}</div>
          <div class="switch-track ${isOn ? 'on' : ''} ${connected ? '' : 'disabled'}" onclick="toggleDevice('${id}')">
            <div class="switch-thumb"></div>
          </div>
        </div>
        <div class="device-cost">
          <span style="color:var(--text-secondary);">${dev.watt} W</span>
          <span style="color:var(--on-color); font-weight:600;">฿${cost.toFixed(2)}</span>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function renderCostSummary(totalKwh) {
    document.getElementById("totalKwh").textContent = totalKwh.toFixed(3) + " kWh";
    document.getElementById("totalCost").textContent = "฿" + (totalKwh * rate).toFixed(2);
  }

  function toggleTheme() {
    document.body.classList.toggle('theme-dark');
  }

  function exportCsv() {
    let csv = "Device,Watt,kWh,Cost\n";
    Object.keys(devices).forEach(id => {
      const d = devices[id];
      csv += `${d.name},${d.watt},${(d.kwh || 0).toFixed(4)},${((d.kwh || 0) * rate).toFixed(2)}\n`;
    });
    const blob = new Blob([csv], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "energy-report.csv";
    a.click();
  }

  renderBreakers();
  connectMqtt();
</script>
</body>
</html>
